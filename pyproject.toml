[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "line-stamp-generator-backend"
version = "1.0.0"
description = "LINEスタンプジェネレーター Python FastAPI バックエンド"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.1",
    "pillow==10.3.0",
    "playwright==1.44.0",
    "keyring==25.2.1",
    "httpx==0.27.0",
    "python-multipart==0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "hypothesis==6.103.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "-v",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.hypothesis]
max_examples = 100
deriving = "always"
